name: Automatic Deploy to Vercel
run-name: Automatic deployment to production

env:
  PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  PUBLIC_PROTOCOL: ${{ secrets.PUBLIC_PROTOCOL }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
  CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
  PG_MAIN_ENTRY_ID: ${{ secrets.PG_MAIN_ENTRY_ID }}

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm 🗜️
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          cache: true
          version: 12
          runtime: node@24.21.0

      - name: Install dependencies 💼
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI 💬
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information 📚
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts 🛠️
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel 🚀
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
