name: Automatic Deploy to Vercel
run-name: Automatic deployment to production

env:
  PUBLIC_ORIGIN: ${{ secrets.PUBLIC_ORIGIN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  PUBLIC_PROTOCOL: ${{ secrets.PUBLIC_PROTOCOL }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
  CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
  PG_MAIN_ENTRY_ID: ${{ secrets.PG_MAIN_ENTRY_ID }}

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm 🗜️
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          runtime: node@24.22.3

      - name: Install dependencies 💼
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel Environment Information 📚
        run: pnpm exec vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts 🛠️
        run: pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel 🚀
        run: pnpm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
